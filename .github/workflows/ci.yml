name: CI

# Builds the frontend and checks the backend on every push and pull request
# to main/develop. Each job skips its steps if its folder is not set up yet.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Check that the frontend exists
        id: check
        working-directory: .
        run: |
          if [ -f frontend/package.json ]; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; echo "No frontend/package.json yet, skipping"; fi
      - if: steps.check.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - if: steps.check.outputs.exists == 'true'
        run: npm ci
      - if: steps.check.outputs.exists == 'true'
        run: npm run lint --if-present
      - if: steps.check.outputs.exists == 'true'
        run: npm run build
      - if: steps.check.outputs.exists == 'true'
        run: npm test --if-present -- --watch=false --browsers=ChromeHeadless

  backend:
    name: Backend (FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Check that the backend exists
        id: check
        working-directory: .
        run: |
          if [ -f backend/requirements.txt ]; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; echo "No backend/requirements.txt yet, skipping"; fi
      - if: steps.check.outputs.exists == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - if: steps.check.outputs.exists == 'true'
        run: pip install -r requirements.txt
      - name: Check that every module compiles
        if: steps.check.outputs.exists == 'true'
        run: python -m compileall -q .
      - name: Run tests
        if: steps.check.outputs.exists == 'true'
        run: |
          if [ -d tests ]; then pip install pytest && pytest -q; else echo "No tests/ folder yet"; fi
