# Labels shared by all my projects. Edit here, push to main and the
# "Sync labels" workflow updates the repo (labels not listed are kept).

# Type
- name: "bug"
  color: "d73a4a"
  description: "Something isn't working"
- name: "enhancement"
  color: "a2eeef"
  description: "New feature or request"
- name: "refactor"
  color: "d4c5f9"
  description: "Code change without new behaviour"
- name: "chore"
  color: "ededed"
  description: "Maintenance, config, tooling"
- name: "documentation"
  color: "0075ca"
  description: "Improvements or additions to documentation"
- name: "security"
  color: "b60205"
  description: "Security or privacy issue"
- name: "test"
  color: "bfd4f2"
  description: "Adding or fixing tests"

# Area
- name: "area: frontend"
  color: "1d76db"
  description: "Angular app"
- name: "area: backend"
  color: "5319e7"
  description: "FastAPI API"
- name: "area: database"
  color: "006b75"
  description: "Schema, migrations and data"
- name: "area: ai"
  color: "f9d0c4"
  description: "LLM / AI features"
- name: "area: i18n"
  color: "bfdadc"
  description: "Translations and locale formatting"
- name: "area: infra"
  color: "c5def5"
  description: "Hosting, environments, CI/CD, deploy"

# Priority
- name: "priority: critical"
  color: "b60205"
  description: "Blocks other work or is a security risk — do first"
- name: "priority: high"
  color: "d93f0b"
  description: "Important for a working, safe app — next in line"
- name: "priority: medium"
  color: "fbca04"
  description: "Should be done, but not blocking"
- name: "priority: low"
  color: "0e8a16"
  description: "Nice to have / polish"

# Status
- name: "blocked"
  color: "000000"
  description: "Waiting on another issue"
- name: "good first issue"
  color: "7057ff"
  description: "Good for newcomers"
